<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poll Vote • SOURAJITVFX WP TOOL</title>
<style>
:root{--c1:#00e5ff;--c2:#7c4dff;--c3:#ff2fd0;--ink:#0b1020;--mut:#6b7390}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,sans-serif;color:var(--ink);background:#f5f7ff;padding:20px 16px 120px;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:fl 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:var(--c1);top:-80px;right:-80px}
.b2{width:360px;height:360px;background:var(--c3);top:40%;left:-140px;animation-delay:-4s}
.b3{width:300px;height:300px;background:var(--c2);bottom:-80px;right:10%;animation-delay:-8s}
@keyframes fl{50%{transform:translate(40px,-30px) scale(1.15)}}
.wrap{max-width:560px;margin:0 auto}
.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.85);box-shadow:0 10px 40px rgba(124,77,255,.16),inset 0 1px 0 #fff;border-radius:28px}
.top{display:flex;align-items:center;gap:12px;padding:4px 2px 18px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--c2);font-size:22px;font-weight:700}
h1{font-size:22px;margin:0;font-weight:800;background:linear-gradient(90deg,#00b8d4,var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12px;color:var(--mut)}
.card{padding:22px;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin:0 0 8px 4px}
.field{margin-bottom:18px}
input{width:100%;padding:16px 18px;border-radius:18px;border:1.5px solid rgba(124,77,255,.15);background:rgba(255,255,255,.75);font-size:15px;color:var(--ink);outline:none;transition:.2s;font-family:inherit}
input:focus{border-color:var(--c1);box-shadow:0 0 0 4px rgba(0,229,255,.18),0 0 24px rgba(0,229,255,.25)}
.hint{font-size:12px;color:var(--mut);margin:7px 4px 0}
.poll{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.7);border:1.5px solid rgba(124,77,255,.12);margin-bottom:8px;cursor:pointer;transition:.2s;font-size:15px;font-weight:600}
.poll i{width:22px;height:22px;border-radius:50%;border:2px solid #c3c9e6;flex:none;transition:.2s}
.poll.on{border-color:var(--c1);background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(124,77,255,.18));box-shadow:0 0 20px rgba(0,229,255,.4)}
.poll.on i{border:7px solid var(--c2);box-shadow:0 0 12px var(--c2)}
.poll em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px}
.add{display:flex;gap:8px;margin-top:6px}
.add button{flex:none;width:52px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 0 18px rgba(0,229,255,.5)}
.btn{width:100%;padding:17px;border:0;border-radius:20px;font-size:16px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));box-shadow:0 0 30px rgba(124,77,255,.5),0 8px 24px rgba(0,229,255,.35);transition:.2s;font-family:inherit}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.adv{font-size:13px;color:var(--c2);font-weight:700;cursor:pointer;margin:0 0 14px 4px;display:inline-block}
#advBox{display:none}
.res{padding:18px;display:none}
.res h4{margin:0 0 10px;font-size:15px}
.res pre{margin:0;padding:14px;border-radius:16px;background:rgba(11,16,32,.88);color:#7dffcf;font-size:12px;overflow:auto;max-height:240px;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-120px);padding:13px 22px;border-radius:99px;font-size:14px;font-weight:700;z-index:20;transition:.4s cubic-bezier(.2,1.3,.4,1)}
.toast.show{transform:translate(-50%,0)}
nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:30px;z-index:9}
nav a{padding:11px 20px;border-radius:22px;text-decoration:none;color:var(--mut);font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
nav a.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 0 22px rgba(0,229,255,.55)}
.sp{width:16px;height:16px;border:2.5px solid #fff5;border-top-color:#fff;border-radius:50%;display:inline-block;animation:s .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="toast glass" id="toast"></div>
<div class="wrap">
  <div class="top"><a class="glass back" href="index.html">‹</a><div><h1>Poll Vote</h1><div class="sub">SOURAJITVFX WP TOOL</div></div></div>
  <section class="glass card">
    <div class="field"><label>Channel Poll URL</label><input id="url" type="url" placeholder="https://whatsapp.com/channel/xxxxx/123" autocomplete="off"></div>
    <div class="field">
      <label>Poll Options</label><div id="opts"></div>
      <div class="add"><input id="newOpt" placeholder="Option text (exact match)" autocomplete="off"><button id="addB">+</button></div>
      <div class="hint">Option ka text poll jaisa exact likhna zaroori hai. Add karke tap se select karo.</div>
    </div>
    <span class="adv" id="advT">⚙︎ Advanced</span>
    <div id="advBox">
      <div class="field"><label>API Key (optional)</label><input id="key" placeholder="Empty = auto-register fresh account"></div>
      <div class="field"><label>API Base URL</label><input id="base" value="https://api.omegatech.app"></div>
    </div>
    <button class="btn" id="go">🗳️ Cast Vote</button>
  </section>
  <section class="glass res" id="res"><h4 id="rt">Response</h4><pre id="out"></pre></section>
</div>
<nav class="glass"><a href="index.html">🏠 Home</a><a href="react.html">😍 React</a><a class="on" href="poll.html">🗳️ Poll</a></nav>
<script>
const $=id=>document.getElementById(id);
let opts=[],sel=-1;
try{opts=JSON.parse(localStorage.getItem('svfx_opts')||'[]')}catch(e){}
function draw(){
  $('opts').innerHTML=opts.map((o,i)=>`<div class="poll ${i===sel?'on':''}" data-i="${i}"><i></i><span>${o.replace(/</g,'&lt;')}</span><em data-d="${i}">✕</em></div>`).join('')||'<div class="hint">Abhi koi option nahi — neeche add karo.</div>';
  try{localStorage.setItem('svfx_opts',JSON.stringify(opts))}catch(e){}
}
$('opts').onclick=e=>{
  const d=e.target.dataset.d;
  if(d!==undefined){opts.splice(+d,1);if(sel===+d)sel=-1;else if(sel>+d)sel--;return draw()}
  const p=e.target.closest('.poll');if(p){sel=+p.dataset.i;draw();navigator.vibrate&&navigator.vibrate(8)}
};
function add(){const v=$('newOpt').value.trim();if(!v)return;opts.push(v);sel=opts.length-1;$('newOpt').value='';draw()}
$('addB').onclick=add;$('newOpt').onkeydown=e=>{if(e.key==='Enter')add()};
$('advT').onclick=()=>{const b=$('advBox');b.style.display=b.style.display==='block'?'none':'block'};
function toast(m,ok){const t=$('toast');t.textContent=m;t.style.color=ok?'#00a152':'#d50040';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function log(o){try{const l=JSON.parse(localStorage.getItem('svfx_log')||'[]');l.unshift({...o,t:Date.now()});localStorage.setItem('svfx_log',JSON.stringify(l.slice(0,50)))}catch(e){}}
$('go').onclick=async()=>{
  const url=$('url').value.trim();
  if(!/^https?:\/\/(www\.)?whatsapp\.com\/channel\//i.test(url))return toast('Valid WhatsApp channel poll URL daalo',false);
  if(sel<0)return toast('Pehle ek option select karo',false);
  const btn=$('go');btn.disabled=true;btn.innerHTML='<span class="sp"></span>Voting...';
  const p={action:'vote',url,option:opts[sel]};
  if($('key').value.trim())p.apiKey=$('key').value.trim();
  let ok=false,text='';
  try{
    const r=await fetch($('base').value.replace(/\/$/,'')+'/api/tools/wa-tool?'+new URLSearchParams(p));
    text=await r.text();ok=r.ok;
    try{const j=JSON.parse(text);text=JSON.stringify(j,null,2);if(j.success===false||j.status===false||j.error)ok=false}catch(e){}
  }catch(e){text='Network/CORS error: '+e.message+'\n\nTip: agar CORS block ho raha ho to page ko same domain ya proxy se chalao.'}
  $('res').style.display='block';$('rt').innerHTML=ok?'✅ Success':'❌ Failed';$('out').textContent=text;
  toast(ok?'Vote cast! 🎉':'Request failed',ok);
  log({type:'vote',ok,url,detail:opts[sel]});
  btn.disabled=false;btn.textContent='🗳️ Cast Vote';
};
draw();
</script>
</body>
</html>
